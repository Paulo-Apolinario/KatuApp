version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: katu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: katu_db
    ports:
      - "5432:5432"
    volumes:
      - katu_postgres_data:/var/lib/postgresql/data

volumes:
  katu_postgres_data:
