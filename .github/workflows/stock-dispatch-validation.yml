name: Stock dispatch - isolated PostgreSQL 16
on:
  push:
    branches: ['work/drafts-stock-dispatch-*']
  pull_request:
    branches: [main]
    paths: ['server/src/modules/waste-stock/**', 'server/tests/collector-web/**', '.github/workflows/stock-dispatch-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend and disposable database tools
        run: |
          npm --prefix server ci --include=dev --no-audit --no-fund
          validation_dir="$RUNNER_TEMP/katua-stock-validation"
          mkdir -p "$validation_dir"
          npm install --prefix "$validation_dir" --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.13 @electric-sql/pglite-socket@0.2.16 @embedded-postgres/linux-x64@16.13.0-beta.17
          echo "KATUA_VALIDATION_TOOLS=$validation_dir" >> "$GITHUB_ENV"
          echo "KATUA_NATIVE_POSTGRES_BIN=$validation_dir/node_modules/@embedded-postgres/linux-x64/native/bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$validation_dir/node_modules/@embedded-postgres/linux-x64/native/lib" >> "$GITHUB_ENV"
          echo "KATUA_NATIVE_PSQL=/usr/bin/psql" >> "$GITHUB_ENV"
      - name: Validate backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
        run: |
          npm --prefix server run prisma:generate
          npm --prefix server run check
          npm --prefix server run build
          cd server
          npx --no-install prisma validate
      - name: Test actual competing connections, rollback and document triggers
        env:
          KATUA_STOCK_DOCUMENT_TRIGGERS: '1'
        run: node server/tests/collector-web/run.mjs
